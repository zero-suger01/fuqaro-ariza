# Prod nginx — docs/11-devops.md D4.
# `/` -> frontend, `/api` -> backend, `/storage` -> minio (read-only proxy,
# bucket internetga to'g'ridan ochilmaydi). HTTPS: certbot (Let's Encrypt).
#
# Sertifikat hali yo'qligida bu fayl ISHLAMAYDI (ssl_certificate topilmaydi)
# — birinchi marta `bootstrap.conf` bilan sertifikat olinadi, keyin shu
# faylga o'tiladi (docs/12-deploy-contabo.md §4).

client_max_body_size 60m;

server {
    listen 80;
    server_name ariza.xronuz.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ariza.xronuz.uz;

    ssl_certificate /etc/letsencrypt/live/ariza.xronuz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ariza.xronuz.uz/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # MinIO — faqat o'qish uchun ochilgan (public-read bucket), /storage
    # prefiksi olib tashlanadi: /storage/ariza-complaints/x -> minio:9000/ariza-complaints/x
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
